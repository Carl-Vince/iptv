
name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download playlist
        run: |
          curl -fLsS --retry 3 \
            "https://raw.githubusercontent.com/best-fan/iptv-sources/main/cn_all_status.m3u8" \
            -o tv.m3u

          grep -q '^#EXTM3U' tv.m3u
          grep -q '^#EXTINF' tv.m3u

      - name: Commit updated playlist
        run: |
          if git diff --quiet -- tv.m3u; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tv.m3u
          git commit -m "Auto update IPTV playlist"
          git push
